name: Horusec 

on:
  push:
    branches: [ "staging" ]
  pull_request:

jobs:
  scan-and-upload:
    runs-on: ubuntu-latest
    name: Scan with Horusec 

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # Cache de dependencias de Horusec
    - name: Cache Horusec image
      uses: actions/cache@v3
      with:
        path: ~/.cache/horusec
        key: horusec-${{ runner.os }}

    - name: Run Horusec 
      run: |
        curl -fsSL https://horusec.io/bin/install.sh | bash
        horusec start -p ./ -o=json -O=horusec-report.json --log-level=info



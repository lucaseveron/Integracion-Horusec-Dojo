name: Horusec

on:
  push:
    branches: [ "staging" ]
  pull_request:

jobs:
  checking_code:
    runs-on: ubuntu-latest
    name: Horusec Scan
    steps:
      - uses: actions/checkout@v3

      - name: Run Horusec
        env:
          AUTHOR: rahul.soni@knoldus.com
          HORUSEC_CLI_RETURN_ERROR_IF_FOUND_VULNERABILITY: "true"
        id: run_horusec
        uses: fike/horusec-action@v0.2.2
        with:
          arguments: -p ./ --config-file-path=horusec-config.json -O horusec-report.json --return-error=true

      - name: Upload Horusec report as artifact
        uses: fike/horusec-action@v0.2.2
        with:
          name: horusec-report
          path: horusec-report.json

